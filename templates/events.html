<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="events.title">Hack Club Events</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navigation.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/events.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ambient-bg.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/effects.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stickers.css') }}">

    <link rel="icon" href="{{ url_for('static', filename='images/hackclub-site/favicon.ico') }}">

</head>

<body>

    {% include 'partials/header.html' %}

    <section class="events-main">

        <div class="events-main-background">
            <img alt="" decoding="async" loading="lazy" src="{{ url_for('static', filename='images/hackclub-site/background.webp')}}"
                style="position: absolute; top: -60px; left: 0px; width: 100%; height: auto; transform: scaleY(-1) translate3d(var(--amb-px, 0px), var(--amb-py, 0px), 0) scale(1.04); opacity: 0.15; pointer-events: none; z-index: 0;">
            <div class="ambient-bg" aria-hidden="true">
                <span class="ambient-blob ambient-blob-red"></span>
                <span class="ambient-blob ambient-blob-orange"></span>
                <span class="ambient-blob ambient-blob-blue"></span>
                <span class="ambient-cursor-glow"></span>
            </div>
        </div>

        <div class="events-header">

            <h1 data-i18n="events.title">Hack Club Events</h1>

            <p data-i18n="events.subtitle">Explore current Hack Club events, hackathons, and YSWS programs from Toolbox.</p>

        </div>

        <div class="events-search">

            <form id="events-search-form" action="">
                <input type="text" id="search-input" data-i18n-attr="placeholder:events.searchPlaceholder" placeholder="Search events&hellip;" autocomplete="off">
                <button type="submit" data-i18n="events.search">Search</button>
            </form>

            <div class="events-filter-tags">
                <button class="filter-tag active" data-filter="all" data-i18n="events.filterAll">All</button>
                <button class="filter-tag" data-filter="hackathon" data-i18n="events.filterHackathon">Hackathon</button>
                <button class="filter-tag" data-filter="ysws" data-i18n="events.filterYSWS">YSWS</button>
                <button class="filter-tag" data-filter="web" data-i18n="events.filterWeb">Web</button>
                <button class="filter-tag" data-filter="cad" data-i18n="events.filterCAD">CAD</button>
                <button class="filter-tag" data-filter="hardware" data-i18n="events.filterHardware">Hardware</button>
                <button class="filter-tag" data-filter="games" data-i18n="events.filterGames">Games</button>
                <button class="filter-tag" data-filter="music" data-i18n="events.filterMusic">Music</button>
                <button class="filter-tag" data-filter="travel" data-i18n="events.filterTravel">Travel</button>
            </div>

        </div>

        <div class="events-list" id="events-list"></div>

    </section>

    {% include 'partials/footer.html' %}

    <script defer src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/dark-mode.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/events-data.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/events.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/ambient-bg.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/i18n-langs.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/effects.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/hc-icons.js') }}"></script>
    <script id="stickerData" type="application/json">{{ sticker_files | tojson }}</script>
    <div class="sticker-field" id="stickerField" data-sticker-count="6" aria-hidden="true"></div>
    <script defer src="{{ url_for('static', filename='js/stickers.js') }}"></script>

    <div class="lang-switcher-wrap">
        <select data-lang-switcher data-i18n-attr="aria-label:pub.language"></select>
    </div>

</body>

</html>
