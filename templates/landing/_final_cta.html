<section class="final-cta">

    <div class="ambient-bg" aria-hidden="true">
        <span class="ambient-blob ambient-blob-red"></span>
        <span class="ambient-blob ambient-blob-blue"></span>
        <span class="ambient-cursor-glow"></span>
    </div>

    <div class="final-cta-inner">

        <h2 class="final-cta-heading" data-i18n="pub.ctaHeading">Ready?</h2>

        <div class="final-cta-form-wrap">
            <input id="ready-email-input" type="email" class="final-cta-input"
                data-i18n-attr="placeholder:pub.emailPlaceholder" placeholder="orpheus@email.com">
            <button type="submit" class="final-cta-join-button" data-i18n="pub.getStarted">Get Started</button>
        </div>

        <p class="final-cta-subtext" data-i18n="pub.ctaText">Get started with building something real.</p>

        <a href="https://hackclub.com/programs" class="final-cta-explore-button">
            <span data-i18n="pub.explorePrograms">Explore current programs</span>
            <span class="final-cta-btn-arrow">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 8H13M13 8L8.5 3.5M13 8L8.5 12.5" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </span>
        </a>

        <p class="final-cta-terms">
            <span data-i18n="pub.termsText">For all teens aged 13&ndash;18. By continuing, you agree to our
                <a href="https://hackclub.com/privacy-and-terms" class="final-cta-terms-link">terms.</a></span>
        </p>

    </div>

</section>
